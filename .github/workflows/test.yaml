name: test

on:
  push:
    branches:
      - "**"
      - "!version-bump/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Check compilation
        run: cargo check --locked
      - name: Run tests
        run: cargo nextest run --no-tests=warn
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Lint pedantic
        run: cargo clippy --all-features --all-targets -- -D clippy::pedantic

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@v4
      - name: Build the docker image for the smoketest
        uses: docker/build-push-action@v7
        with:
          load: true
          push: false
          tags: "virtual-lb:latest"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: virtual-lb

      - name: Run the demo as a basic smoketest
        run: just demo

      - name: Assert controller assigned member IPs
        run: |
          expected_ips='127.0.0.2 127.0.0.3'
          actual_ips="$(kubectl get --namespace demo svc/virtual \
            --output jsonpath='{range .status.loadBalancer.ingress[*]}{.ip}{" "}{end}')"
          actual_ips="${actual_ips% }"
          test "$actual_ips" = "$expected_ips"
